name: ci
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with: { go-version-file: go.mod }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libwebkit2gtk-4.1-dev libx11-dev libxtst-dev libxkbcommon-dev \
            libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libgl1-mesa-dev libasound2-dev xvfb
      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - run: go vet ./...
      # The display tests of the editor need a screen on Linux.
      - name: Go tests
        shell: bash
        run: |
          if [ "$RUNNER_OS" = Linux ]; then xvfb-run -a go test ./...; else go test ./...; fi

  helpers:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build -c release --package-path helpers/mac
